<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد مفاتيح التفعيل وإدارة العملاء - LUXURY KEY GENERATOR</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  border: none !important;
  outline: none !important;
}

:root {
  --bg: #020405;
  --panel: #060c0e;
  --panel2: #0a1316;
  --panel3: #0f1c20;
  --lime: #a8ff00;
  --lime2: #c4ff52;
  --text: #f8faf7;
  --muted: #7a8c88;
  --danger: #ff5b67;
  --blue: #55b8ff;
  --shadow-luxury: 0 30px 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(168, 255, 0, 0.04);
}

body {
  background: radial-gradient(circle at 50% 0%, rgba(168,255,0,0.08), transparent 40%), var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 15px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.app-container {
  width: 100%;
  max-width: 500px;
  background: var(--panel);
  border-radius: 28px;
  box-shadow: var(--shadow-luxury);
  display: flex;
  flex-direction: column;
  overflow: visible;
  position: relative;
  padding: 22px;
  gap: 18px;
}

.header {
  background: linear-gradient(145deg, var(--panel2), var(--panel3));
  padding: 16px 18px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.4);
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, var(--lime), #729e00);
  color: #000;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
  box-shadow: 0 8px 20px rgba(168,255,0,0.3);
}

.brand-text h1 {
  font-size: 16px;
  color: var(--lime);
  font-weight: 900;
  letter-spacing: 0.8px;
  text-shadow: 0 0 15px rgba(168,255,0,0.4);
}

.brand-text span {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel2);
  padding: 14px 18px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.btn-open-form {
  background: linear-gradient(135deg, var(--lime), #8fd400);
  color: #000;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 11.5px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 6px 20px rgba(168,255,0,0.25);
}

.btn-open-form:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(168,255,0,0.4);
}

.stats-info {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.stats-info span {
  color: var(--lime);
  font-weight: bold;
}

.add-modal-container {
  background: var(--panel2);
  padding: 18px;
  border-radius: 18px;
  display: none;
  flex-direction: column;
  gap: 14px;
  animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

.add-modal-container.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: var(--lime);
  font-weight: bold;
  padding-bottom: 10px;
}

.btn-close-modal {
  background: rgba(255,91,103,0.15);
  color: var(--danger);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 10.5px;
  cursor: pointer;
  transition: 0.2s;
}

.btn-close-modal:hover {
  background: rgba(255,91,103,0.3);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}

.form-group.full {
  grid-column: span 2;
}

.form-group label {
  font-size: 11px;
  color: var(--lime2);
  font-weight: 600;
  letter-spacing: 0.3px;
}

.form-input {
  background: var(--panel);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 12px;
  width: 100%;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.7);
  transition: all 0.25s ease;
}

.form-input:focus {
  background: var(--panel3);
  box-shadow: 0 0 15px rgba(168,255,0,0.15), inset 0 3px 6px rgba(0,0,0,0.7);
}

/* تصميم الزر الخاص باختيار الصلاحية الفاخر */
.custom-select-box {
  background: var(--panel);
  color: var(--text);
  padding: 11px 14px;
  border-radius: 12px;
  font-size: 12px;
  width: 100%;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.25s;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.7);
}

.custom-select-box:hover {
  background: var(--panel3);
  box-shadow: 0 0 15px rgba(168,255,0,0.1), inset 0 3px 6px rgba(0,0,0,0.7);
}

/* تصميم قائمة الخيارات الفاخرة المنسدلة بدون حدود */
.custom-dropdown-list {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: var(--panel3);
  border-radius: 16px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.95), 0 0 25px rgba(168,255,0,0.1);
  display: none;
  flex-direction: column;
  z-index: 9999;
  overflow: hidden;
  padding: 8px;
  gap: 5px;
  animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.custom-dropdown-list.active {
  display: flex;
}

.custom-option {
  padding: 13px 16px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.custom-option:hover {
  background: rgba(168,255,0,0.1);
  color: var(--lime);
  padding-right: 20px;
}

.custom-option.selected {
  background: rgba(168,255,0,0.18);
  color: var(--lime);
  font-weight: bold;
  box-shadow: inset 0 0 10px rgba(168,255,0,0.1);
}

.custom-option.selected::after {
  content: '✓';
  color: var(--lime);
  font-weight: bold;
  font-size: 13px;
}

.btn-generate {
  background: linear-gradient(135deg, var(--lime), #8fd400);
  color: #000;
  padding: 13px;
  border-radius: 12px;
  font-weight: 900;
  font-size: 12.5px;
  cursor: pointer;
  text-align: center;
  transition: all 0.3s ease;
  grid-column: span 2;
  margin-top: 6px;
  box-shadow: 0 8px 25px rgba(168,255,0,0.3);
}

.btn-generate:hover {
  transform: translateY(-1px);
  opacity: 0.95;
  box-shadow: 0 12px 30px rgba(168,255,0,0.45);
}

.output-box {
  background: var(--panel);
  padding: 14px;
  border-radius: 12px;
  display: none;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}

.output-box.active {
  display: flex;
}

.key-display {
  background: var(--bg);
  color: var(--lime);
  padding: 12px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 11px;
  word-break: break-all;
  text-align: left;
  direction: ltr;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
}

.btn-copy {
  background: rgba(85,184,255,0.15);
  color: var(--blue);
  width: 100%;
  padding: 9px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}

.btn-copy:hover {
  background: rgba(85,184,255,0.3);
}

.history-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--panel2);
  padding: 16px;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.history-header-title {
  font-size: 12px;
  color: var(--lime);
  font-weight: bold;
  margin-bottom: 2px;
  letter-spacing: 0.4px;
}

.search-box {
  width: 100%;
  background: var(--panel);
  padding: 11px 15px;
  border-radius: 12px;
  color: var(--text);
  font-size: 11.5px;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.7);
}

.search-box:focus {
  background: var(--panel3);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 380px;
  overflow-y: auto;
  padding-right: 3px;
}

.history-item {
  background: var(--panel);
  padding: 13px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: all 0.25s ease;
}

.history-item:hover {
  transform: translateX(-2px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.history-info h4 {
  font-size: 12px;
  color: var(--text);
  font-weight: 700;
}

.history-info p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}

.history-actions {
  display: flex;
  gap: 6px;
}

.btn-sm {
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.btn-sm-copy {
  background: rgba(85,184,255,0.15);
  color: var(--blue);
}

.btn-sm-copy:hover {
  background: rgba(85,184,255,0.3);
}

.btn-sm-del {
  background: rgba(255,91,103,0.15);
  color: var(--danger);
}

.btn-sm-del:hover {
  background: rgba(255,91,103,0.3);
}

.toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--panel3);
  color: var(--lime);
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 11.5px;
  font-weight: bold;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 99999;
  box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 25px rgba(168,255,0,0.25);
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<div class="app-container">
  <header class="header">
    <div class="brand">
      <div class="brand-logo">🔑</div>
      <div class="brand-text">
        <h1>KEY GENERATOR</h1>
        <span>نظام إصدار وإدارة مفاتيح التفعيل الفاخر</span>
      </div>
    </div>
  </header>

  <div class="action-bar">
    <button class="btn-open-form" onclick="toggleAddForm()">➕ إضافة عميل جديد</button>
    <div class="stats-info">إجمالي العملاء: <span id="clientCount">0</span></div>
  </div>

  <div class="add-modal-container" id="addModalContainer">
    <div class="modal-header">
      <span>تعبئة بيانات العميل وتوليد مفتاح التفعيل</span>
      <button class="btn-close-modal" onclick="toggleAddForm()">✕ إغلاق</button>
    </div>

    <div class="form-grid">
      <div class="form-group full">
        <label>اسم المتجر / العميل (Brand Name) *</label>
        <input type="text" class="form-input" id="clientName" placeholder="مثال: SOFIANE SHOP">
      </div>

      <!-- قائمة اختيار الصلاحية المخصصة الفاخرة بدون حدود -->
      <div class="form-group">
        <label>مدة صلاحية الحساب</label>
        <div class="custom-select-box" id="customSelectBtn" onclick="toggleCustomDropdown(event)">
          <span id="selectedOptionText">سنة (365 يوم)</span>
          <span style="color:var(--lime); font-size:10px;">▼</span>
        </div>
        <div class="custom-dropdown-list" id="customDropdownList">
          <div class="custom-option" onclick="selectOption(event, '1', 'تجربة 24 ساعة (يوم واحد)')">تجربة 24 ساعة (يوم واحد)</div>
          <div class="custom-option" onclick="selectOption(event, '30', 'شهر (30 يوم)')">شهر (30 يوم)</div>
          <div class="custom-option" onclick="selectOption(event, '90', '3 أشهر (90 يوم)')">3 أشهر (90 يوم)</div>
          <div class="custom-option" onclick="selectOption(event, '180', '6 أشهر (180 يوم)')">6 أشهر (180 يوم)</div>
          <div class="custom-option selected" onclick="selectOption(event, '365', 'سنة (365 يوم)')">سنة (365 يوم)</div>
          <div class="custom-option" onclick="selectOption(event, '0', 'دائم (بدون انتهاء)')">دائم (بدون انتهاء)</div>
        </div>
        <input type="hidden" id="clientDuration" value="365">
      </div>

      <div class="form-group">
        <label>مدون الحساب / المسؤول</label>
        <input type="text" class="form-input" id="clientAccountant" placeholder="مثال: Soufiane Admin">
      </div>

      <div class="form-group">
        <label>رقم الهاتف الأساسي</label>
        <input type="text" class="form-input" id="clientPhone" placeholder="06 66 22 70 60">
      </div>

      <div class="form-group">
        <label>رقم الواتساب</label>
        <input type="text" class="form-input" id="clientWhatsapp" placeholder="+212 6 30 47 34 98">
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني (Gmail)</label>
        <input type="email" class="form-input" id="clientGmail" placeholder="client@gmail.com">
      </div>

      <div class="form-group full">
        <label>رابط اللوجو الخاص بالعميل (Image URL)</label>
        <input type="text" class="form-input" id="clientLogo" placeholder="https://domain.com/logo.jpg">
      </div>

      <div class="form-group">
        <label>اسم الإمضاء والخاتم</label>
        <input type="text" class="form-input" id="clientSign" placeholder="مثال: Soufiane">
      </div>

      <div class="form-group">
        <label>عنوان المحل / المتجر</label>
        <input type="text" class="form-input" id="clientAddress" placeholder="تطوان - حي المدرسي">
      </div>

      <button class="btn-generate" onclick="generateAndSaveKey()">⚡ إصدار وحفظ كود التفعيل</button>
    </div>

    <div class="output-box" id="outputBox">
      <label style="font-size:10.5px; color:var(--muted);">كود التفعيل المشفر المولد:</label>
      <div class="key-display" id="keyResult"></div>
      <button class="btn-copy" onclick="copyKey()">📋 نسخ الكود وتسليمه للعميل</button>
    </div>
  </div>

  <div class="history-section">
    <div class="history-header-title">📁 سجل العملاء المفعلين</div>
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 ابحث باسم العميل أو مدون الحساب..." oninput="filterHistory()">
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="toast" id="toastMsg">تمت العملية بنجاح</div>

<script>
let clientsHistory = JSON.parse(localStorage.getItem("app_clients_history") || "[]");

document.addEventListener("DOMContentLoaded", () => {
  renderHistory();
});

function toggleCustomDropdown(e) {
  e.stopPropagation();
  const list = document.getElementById("customDropdownList");
  list.classList.toggle("active");
}

function selectOption(e, value, text) {
  e.stopPropagation();
  document.getElementById("clientDuration").value = value;
  document.getElementById("selectedOptionText").textContent = text;
  document.getElementById("customDropdownList").classList.remove("active");
  
  document.querySelectorAll(".custom-option").forEach(opt => opt.classList.remove("selected"));
  e.currentTarget.classList.add("selected");
}

window.addEventListener("click", () => {
  const list = document.getElementById("customDropdownList");
  if(list && list.classList.contains("active")) {
    list.classList.remove("active");
  }
});

function toggleAddForm() {
  const modal = document.getElementById("addModalContainer");
  modal.classList.toggle("active");
  if(modal.classList.contains("active")) {
    document.getElementById("clientName").focus();
  }
}

function safeBase64Encode(str) {
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
    return String.fromCharCode('0x' + p1);
  }));
}

function generateAndSaveKey() {
  const name = document.getElementById("clientName").value.trim();
  const accountant = document.getElementById("clientAccountant").value.trim();
  const phone = document.getElementById("clientPhone").value.trim();
  const whatsapp = document.getElementById("clientWhatsapp").value.trim();
  const gmail = document.getElementById("clientGmail").value.trim();
  const logo = document.getElementById("clientLogo").value.trim();
  const sign = document.getElementById("clientSign").value.trim();
  const address = document.getElementById("clientAddress").value.trim();
  const duration = parseInt(document.getElementById("clientDuration").value);

  if(!name) {
    showToast("يرجى إدخال اسم العميل على الأقل!");
    return;
  }

  const createdAt = new Date().toISOString().split('T')[0];
  let expiresAt = "31/12/2030";

  if (duration > 0) {
    const expDate = new Date();
    expDate.setDate(expDate.getDate() + duration);
    let day = String(expDate.getDate()).padStart(2, '0');
    let month = String(expDate.getMonth() + 1).padStart(2, '0');
    let year = expDate.getFullYear();
    expiresAt = `${day}/${month}/${year}`;
  } else if (duration === 0) {
    expiresAt = "31/12/2030";
  }

  const payload = {
    n: name,
    e: expiresAt,
    p: phone || "06 00 00 00 00",
    w: whatsapp || "+212 6 00 00 00 00",
    g: gmail || "support@gmail.com",
    l: logo || "https://i.ibb.co/LXWzbssm/IMG-20261104-145706.jpg",
    s: sign || name.split(" ")[0],
    a: address || "المغرب"
  };

  const jsonStr = JSON.stringify(payload);
  const encodedKey = "KEY_" + safeBase64Encode(jsonStr);

  document.getElementById("keyResult").textContent = encodedKey;
  document.getElementById("outputBox").classList.add("active");

  const clientData = {
    id: Date.now(),
    name: name,
    accountant: accountant || "مسؤول النظام",
    key: encodedKey,
    createdAt: createdAt,
    expiresAt: expiresAt
  };

  clientsHistory.unshift(clientData);
  localStorage.setItem("app_clients_history", JSON.stringify(clientsHistory));
  
  renderHistory();
  showToast("تم توليد الكود وحفظ العميل بنجاح!");
}

function renderHistory(filteredList = null) {
  const listEl = document.getElementById("historyList");
  const countEl = document.getElementById("clientCount");
  
  const dataToRender = filteredList || clientsHistory;
  countEl.textContent = clientsHistory.length;

  if (dataToRender.length === 0) {
    listEl.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:11.5px; padding:30px;">لا يوجد عملاء مسجلين حالياً</div>`;
    return;
  }

  listEl.innerHTML = dataToRender.map(item => `
    <div class="history-item">
      <div class="history-info">
        <h4>${item.name} <span style="font-size:9.5px; color:var(--lime);">(${item.accountant})</span></h4>
        <p>الإنشاء: ${item.createdAt} | ينتهي: ${item.expiresAt}</p>
      </div>
      <div class="history-actions">
        <button class="btn-sm btn-sm-copy" onclick="copySpecificKey('${item.key}')">نسخ</button>
        <button class="btn-sm btn-sm-del" onclick="deleteClient(${item.id})">حذف</button>
      </div>
    </div>
  `).join('');
}

function filterHistory() {
  const query = document.getElementById("searchBox").value.toLowerCase();
  const filtered = clientsHistory.filter(item => 
    item.name.toLowerCase().includes(query) || 
    item.accountant.toLowerCase().includes(query)
  );
  renderHistory(filtered);
}

function copyKey() {
  const keyText = document.getElementById("keyResult").textContent;
  copyToClipboard(keyText);
}

function copySpecificKey(key) {
  copyToClipboard(key);
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast("تم نسخ كود التفعيل!");
  });
}

function deleteClient(id) {
  clientsHistory = clientsHistory.filter(item => item.id !== id);
  localStorage.setItem("app_clients_history", JSON.stringify(clientsHistory));
  renderHistory();
  showToast("تم حذف العميل من السجل");
}

function showToast(msg) {
  const t = document.getElementById("toastMsg");
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
